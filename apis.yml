name: Ordergroove
kind: company
description: Ordergroove is an enterprise subscription and relationship-commerce
  platform that lets retailers and DTC brands offer recurring purchases, autoship,
  memberships, bundles, prepaid, and rotating/curation subscriptions on top of their
  existing eCommerce store. It exposes a documented public REST API at
  restapi.ordergroove.com organized around a four-object data model - Customer,
  Subscription, Item, and Order - plus supporting resources for Products, Offers and
  Incentives, Payments, Addresses, and Entitlements, along with outbound Webhooks for
  order, item, subscription, and subscriber events. Requests use an Application API
  scope (x-api-key header, server-to-server) or a Storefront API scope
  (HMAC-SHA256-signed, single-customer context). A GraphQL API for subscription and
  order data is in Early Access. The platform itself is enterprise and sold through
  sales, but the developer documentation and API reference are publicly readable.
