description: >-
  FinOps view of Ordergroove spend. Ordergroove is an enterprise subscription and
  relationship-commerce platform billed through a negotiated commercial contract
  rather than public self-serve pricing. Cost is typically a platform fee plus a
  usage/revenue-share component tied to subscription program performance (active
  subscribers, recurring orders, or subscription revenue). The REST API and
  webhooks carry no separately advertised per-call fee; API usage is governed by
  the 6,000 requests/IP/minute rate limit rather than metered billing. Exact
  commercial terms are custom per merchant and are not reconciled here.
notes: >-
  Ordergroove does not publish per-unit rates. The meters below are modeled from
  public product positioning (revenue-share / active-subscriber style enterprise
  SaaS) and should be verified against the actual Ordergroove contract during
  reconciliation. The dominant cost driver is the platform contract, not API
  request volume.
