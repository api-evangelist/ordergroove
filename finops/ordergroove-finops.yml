billingModel:
  pricingCategory: Committed-Contract
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
  - Purchase
  - Usage
  - Adjustment
focusColumns:
  ServiceName: Ordergroove Subscription Platform
  ServiceCategory: Commerce and Subscriptions
  ProviderName: Ordergroove
  PublisherName: Ordergroove
  InvoiceIssuerName: Ordergroove
  BillingCurrency: USD
  ChargeCategory: Purchase
