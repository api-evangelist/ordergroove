meters:
- name: platform_fee
  description: Base platform contract fee for the subscription-commerce program (modeled; contract-specific).
  unit: contract
  aggregation: sum
  dimensions:
  - account
- name: active_subscribers
  description: Active subscribers in the program, a common enterprise usage/revenue-share driver (modeled).
  unit: subscribers
  aggregation: max
  dimensions:
  - account
  - program
- name: recurring_orders
  description: Recurring orders generated and placed to the merchant platform (modeled usage driver).
  unit: orders
  aggregation: sum
  dimensions:
  - account
  - program
- name: subscription_revenue
  description: Subscription revenue processed through the program, a possible revenue-share basis (modeled).
  unit: usd
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track active subscribers, recurring order volume, and subscription revenue as the drivers of the Ordergroove contract; API request volume is rate-limited, not billed.
- name: Allocation
  description: Map subscription programs and stores to internal business units so platform cost is attributed to the brands that generate the recurring revenue.
- name: Optimization
  description: Reduce churn and improve incentive/offer efficiency to raise revenue per platform dollar; batch API reads within the 6,000/IP/minute limit to avoid throttling.
- name: Accountability
  description: Assign program owners and review the Ordergroove contract against subscription revenue and retention outcomes at renewal.
